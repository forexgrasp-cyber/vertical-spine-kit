description = "CallAgent - Voice AI for Local Businesses"
requires-python = ">=3.12"
dependencies = [
    "shared-canonical-services==2026.10.0",
]

# Install from local dist in dev: pip install ../shared-canonical-services/dist/shared_canonical_services-2026.10.0-py3-none-any.whl
